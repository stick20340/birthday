<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0a15">
<title>Happy Birthday</title>
<style>
:root{--night:#0d0a15;--paper:#fffaf4;--ink:#352b37;--rose:#835268;--muted:#aaa0b2;--gold:#ead7a1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;background:var(--night);color:#fff;overflow-x:hidden}
button,input{font:inherit}
.bg{position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 18% 20%,rgba(121,79,166,.26),transparent 28%),
radial-gradient(circle at 82% 18%,rgba(47,86,141,.19),transparent 27%),
radial-gradient(circle at 50% 84%,rgba(143,78,103,.15),transparent 28%),
linear-gradient(180deg,#151020,#0d0a15)}
#stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:white;opacity:.45;animation:blink var(--d) ease-in-out infinite alternate}
@keyframes blink{to{opacity:.1;transform:scale(.65)}}
.view{display:none;min-height:100vh;place-items:center;padding:32px 18px;position:relative;z-index:2}
.view.active{display:grid;animation:enter .65s ease both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}
.wrap{width:min(860px,100%)}.center{text-align:center}
.eyebrow{font:600 11px/1.2 system-ui,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:#b9b0c0}
.hero-title{font-size:clamp(4rem,15vw,9.4rem);line-height:.82;letter-spacing:-.075em;margin:24px 0 0;font-weight:500}
.hero-name{font-size:clamp(1.3rem,4.5vw,2.1rem);margin-top:30px}.hero-date{font:500 12px/1.6 system-ui,sans-serif;color:#9f97aa;margin-top:8px}
.cta{margin-top:36px;padding:13px 23px;border-radius:999px;border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.04);color:white;cursor:pointer;transition:.2s}
.cta:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}
.paper{position:relative;background:linear-gradient(180deg,#fffaf4,#f7eee4);color:var(--ink);box-shadow:0 30px 100px rgba(0,0,0,.42);padding:clamp(34px,8vw,72px)}
.paper:before{content:"";position:absolute;inset:14px;border:1px solid rgba(62,45,58,.09);pointer-events:none}
.lock-card{width:min(520px,100%);background:rgba(18,14,26,.82);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:clamp(28px,7vw,46px);backdrop-filter:blur(16px);box-shadow:0 28px 90px rgba(0,0,0,.35)}
.lock-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;background:rgba(255,255,255,.08);font-size:24px}
.lock-card h1{font-size:clamp(1.8rem,6vw,2.7rem);font-weight:500;margin:0 0 10px}.lock-card p{color:#b8afbf;line-height:1.75;font:500 14px/1.7 system-ui,sans-serif}
.password-row{display:flex;gap:8px;margin-top:22px}.password-row input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.16);background:#0d0b13;color:white;border-radius:12px;padding:12px 13px;outline:none}
.password-row button{border:0;border-radius:12px;padding:12px 16px;background:#ead7a1;color:#2d2519;font-weight:800;cursor:pointer}
.msg{min-height:20px;margin-top:12px;color:#e8b9c4;font:600 12px/1.5 system-ui,sans-serif}
.seal{width:58px;height:58px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;background:var(--rose);color:#ffeade;box-shadow:inset 0 0 0 4px rgba(255,255,255,.08);font-size:20px}
.intro h2{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:500;margin:0 0 25px}
.copy{white-space:pre-line;line-height:2;color:#5a4e5b;font-size:clamp(1rem,2.8vw,1.12rem)}
.paper-btn{margin-top:28px;padding:12px 20px;border:0;border-radius:999px;background:#342b37;color:white;cursor:pointer}
.stage{width:min(760px,100%)}.meta{display:flex;justify-content:space-between;gap:12px;color:#aaa2b3;font:500 11px/1.4 system-ui,sans-serif;letter-spacing:.08em}
.progress{height:1px;background:rgba(255,255,255,.12);margin:12px 0 24px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--gold);transition:.35s}
.letter{min-height:520px}.from{font-size:clamp(1.3rem,4vw,1.9rem);margin-bottom:34px}
.letter-text{white-space:pre-line;line-height:2.08;color:#453a45;font-size:clamp(1rem,2.7vw,1.12rem)}
.photo{display:none;margin-top:36px}.photo img{display:block;max-width:100%;max-height:430px;object-fit:contain;margin:auto;box-shadow:0 12px 34px rgba(0,0,0,.15)}
.caption{text-align:center;margin-top:10px;color:#7e7080;font:500 12px/1.5 system-ui,sans-serif}
.nav{display:flex;justify-content:center;gap:10px;margin-top:22px}.nav button{padding:11px 17px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#fff;cursor:pointer}
.final h2{font-size:clamp(2.8rem,9vw,5.2rem);font-weight:500;letter-spacing:-.045em;margin:22px 0}.final p{white-space:pre-line;line-height:2;color:#d8d2de}
.sign{margin-top:28px;color:#9f96aa;font:500 12px/1.5 system-ui,sans-serif}
@media(max-width:560px){.paper{padding:38px 27px}.letter{min-height:590px}.hero-title{font-size:20vw}.password-row{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="bg"></div><div id="stars"></div>

<section class="view active" id="lock"><div class="wrap center">
  <div class="lock-card" style="margin:auto">
    <div class="lock-icon">🔒</div>
    <div class="eyebrow">private birthday letter</div>
    <h1>비밀번호를 입력해주세요</h1>
    <p>이 페이지의 편지는 암호화되어 있어요.<br>전달받은 비밀번호를 입력하면 열립니다.</p>
    <div class="password-row">
      <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호">
      <button id="unlockBtn">열기</button>
    </div>
    <div class="msg" id="lockMsg"></div>
  </div>
</div></section>

<section class="view" id="home"><div class="wrap center">
 <div class="eyebrow">a little gift for you</div>
 <h1 class="hero-title">HAPPY<br>BIRTHDAY</h1>
 <div class="hero-name" id="heroName"></div>
 <div class="hero-date" id="heroDate"></div>
 <button class="cta" onclick="go('intro')">편지 열어보기</button>
</div></section>

<section class="view" id="intro"><div class="wrap">
 <article class="paper intro center">
  <div class="seal">✦</div>
  <h2 id="introTitle"></h2><p class="copy" id="introText"></p>
  <button class="paper-btn" onclick="startLetters()">첫 번째 편지 →</button>
 </article>
</div></section>

<section class="view" id="letters"><div class="stage">
 <div class="meta"><span>LETTERS FOR YOU</span><span id="counter"></span></div>
 <div class="progress"><i id="bar"></i></div>
 <article class="paper letter">
  <div class="from" id="from"></div><div class="letter-text" id="letterText"></div>
  <div class="photo" id="photo"><img id="photoImg" alt=""><div class="caption" id="caption"></div></div>
 </article>
 <div class="nav"><button id="prev" onclick="prevLetter()">← 이전</button><button id="next" onclick="nextLetter()">다음 →</button></div>
</div></section>

<section class="view" id="ending"><div class="wrap center final">
 <div class="eyebrow">one last thing</div>
 <h2 id="endingTitle"></h2><p id="endingText"></p><div class="sign" id="endingSign"></div>
 <button class="cta" onclick="go('home')">처음부터 다시 보기</button>
</div></section>

<script>
let DATA=null, ENC=null, current=0;
const $=id=>document.getElementById(id);
const enc=new TextEncoder(), dec=new TextDecoder();

function b64ToBytes(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function deriveKey(password,salt,iterations){
 const material=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations},material,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function decryptPayload(payload,password){
 const salt=b64ToBytes(payload.salt), iv=b64ToBytes(payload.iv), ciphertext=b64ToBytes(payload.ciphertext);
 const key=await deriveKey(password,salt,payload.iterations||310000);
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ciphertext);
 return JSON.parse(dec.decode(plain));
}
function go(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$(id).classList.add("active");scrollTo({top:0,behavior:"smooth"})}
function startLetters(){current=0;renderLetter();go("letters")}
function prevLetter(){if(current>0){current--;renderLetter();scrollTo({top:0,behavior:"smooth"})}}
function nextLetter(){if(current<DATA.letters.length-1){current++;renderLetter();scrollTo({top:0,behavior:"smooth"})}else go("ending")}
function renderAll(){
 const s=DATA.settings||{};
 $("heroName").textContent=s.recipient||"";
 $("heroDate").textContent=s.date||"";
 $("introTitle").textContent=s.introTitle||"";
 $("introText").textContent=s.introText||"";
 $("endingTitle").textContent=s.endingTitle||"";
 $("endingText").textContent=s.endingText||"";
 $("endingSign").textContent=s.endingSign||"";
}
function renderLetter(){
 const x=DATA.letters[current],t=DATA.letters.length;
 $("from").textContent="From. "+(x.name||"익명"); $("letterText").textContent=x.text||"";
 $("counter").textContent=String(current+1).padStart(2,"0")+" / "+String(t).padStart(2,"0");
 $("bar").style.width=((current+1)/t*100)+"%"; $("prev").style.visibility=current===0?"hidden":"visible";
 $("next").textContent=current===t-1?"마지막으로 →":"다음 →";
 if(x.image){$("photo").style.display="block";$("photoImg").src=x.image;$("caption").textContent=x.caption||""}
 else{$("photo").style.display="none";$("photoImg").removeAttribute("src");$("caption").textContent=""}
}
async function unlock(){
 const pw=$("password").value;
 if(!ENC?.configured){$("lockMsg").textContent="아직 편지가 준비되지 않았어요.";return}
 if(!pw){$("lockMsg").textContent="비밀번호를 입력해주세요.";return}
 $("lockMsg").textContent="편지를 여는 중…"; $("unlockBtn").disabled=true;
 try{
   DATA=await decryptPayload(ENC,pw);
   if(!DATA?.letters?.length)throw new Error("No letters");
   renderAll(); $("password").value=""; go("home");
 }catch(e){$("lockMsg").textContent="비밀번호가 맞지 않아요."; console.error(e)}
 finally{$("unlockBtn").disabled=false}
}
function currentGiftId(){
 const raw=new URLSearchParams(location.search).get("gift")||"";
 return /^[A-Za-z0-9_-]{1,64}$/.test(raw)?raw:"";
}
async function loadEncrypted(){
 const gift=currentGiftId();
 if(!gift){
   $("lockMsg").textContent="올바른 생일 페이지 링크가 아니에요.";
   $("unlockBtn").disabled=true;
   $("password").disabled=true;
   return;
 }
 try{
  const filename=`./encrypted-data-${gift}.json`;
  const r=await fetch(filename+"?v="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error();
  ENC=await r.json();
  if(!ENC.configured)throw new Error("not configured");
  if(ENC.pageId && ENC.pageId!==gift)throw new Error("page id mismatch");
 }catch{
  ENC=null;
  $("lockMsg").textContent="이 생일 페이지의 편지 파일을 불러오지 못했어요.";
  $("unlockBtn").disabled=true;
 }
}
function sky(){for(let i=0;i<95;i++){const s=document.createElement("i");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.setProperty("--d",(2+Math.random()*5)+"s");s.style.animationDelay=(-Math.random()*5)+"s";$("stars").appendChild(s)}}
$("unlockBtn").onclick=unlock;$("password").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
window.go=go;window.startLetters=startLetters;window.prevLetter=prevLetter;window.nextLetter=nextLetter;
sky();loadEncrypted();
</script>
</body>
</html>
